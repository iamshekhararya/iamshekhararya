<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <radialGradient id="bgc" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2a1a0a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="200" cy="200" r="178"/></clipPath>
  </defs>

  <circle cx="200" cy="200" r="195" fill="url(#ring)"/>
  <circle cx="200" cy="200" r="184" fill="#0d1117"/>
  <circle cx="200" cy="200" r="178" fill="url(#bgc)"/>

  <g clip-path="url(#circle)">
    <!-- code symbols in background -->
    <text x="40" y="130" font-family="Consolas, monospace" font-size="46" font-weight="700" fill="#FF7A1A" fill-opacity="0.18">&lt;/&gt;</text>
    <text x="270" y="110" font-family="Consolas, monospace" font-size="40" font-weight="700" fill="#FF7A1A" fill-opacity="0.18">{ }</text>

    <!-- shoulders / hoodie -->
    <path d="M40 400 C40 320 110 285 200 285 C290 285 360 320 360 400 Z" fill="#FF7A1A"/>
    <path d="M165 285 L200 330 L235 285 Z" fill="#0d1117" fill-opacity="0.35"/>
    <path d="M150 300 L150 345 M250 300 L250 345" stroke="#FFD2A1" stroke-width="5" stroke-linecap="round"/>

    <!-- neck -->
    <rect x="173" y="240" width="54" height="55" rx="20" fill="#C98A5E"/>

    <!-- ears -->
    <ellipse cx="124" cy="195" rx="13" ry="20" fill="#D9996B"/>
    <ellipse cx="276" cy="195" rx="13" ry="20" fill="#D9996B"/>

    <!-- face -->
    <ellipse cx="200" cy="190" rx="78" ry="90" fill="#E0A173"/>

    <!-- hair -->
    <path d="M118 175 C112 105 160 80 205 80 C255 80 292 110 282 175 C272 140 250 125 200 125 C150 125 128 140 118 175 Z" fill="#1b1b1f"/>
    <path d="M130 120 C150 82 250 70 275 115 C240 98 170 98 130 120 Z" fill="#2a2a30"/>

    <!-- glasses -->
    <g fill="none" stroke="#FF7A1A" stroke-width="5">
      <rect x="143" y="178" width="46" height="36" rx="12"/>
      <rect x="211" y="178" width="46" height="36" rx="12"/>
      <path d="M189 194 H211"/>
    </g>
    <circle cx="166" cy="196" r="6" fill="#1b1b1f"/>
    <circle cx="234" cy="196" r="6" fill="#1b1b1f"/>

    <!-- brows, nose, smile -->
    <path d="M148 166 Q166 158 184 166 M216 166 Q234 158 252 166" stroke="#1b1b1f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M200 198 Q194 220 204 224" stroke="#B97A52" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M170 240 Q200 262 230 240" stroke="#7a3b1c" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
